<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Industrial Platform" />
    <link rel="icon" type="image/png" href="/brand/mark.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Industrial Platform</title>
    <!--
      首帧主题恢复(PF-01 §7.3):在应用模块加载前同步、无依赖、异常吞吐地读取
      设备级 bootstrap 外观快照并设置根节点属性,避免明亮/暗色闪烁。
      只读 bootstrap 键,不读取认证会话或用户键,也不记录存储内容。
    -->
    <script>
      ;(function () {
        var KEY = 'industrial-platform.ui.bootstrap.v1'
        var PALETTES = ['industrial-cyan', 'technology-blue', 'neutral-gray']
        var MODES = ['light', 'dark', 'system']
        var DENSITIES = ['comfortable', 'compact']
        var root = document.documentElement
        var palette = 'industrial-cyan'
        var mode = 'system'
        var density = 'comfortable'
        try {
          var raw = localStorage.getItem(KEY)
          if (raw) {
            var data = JSON.parse(raw)
            if (data && data.version === 1) {
              if (PALETTES.indexOf(data.palette) !== -1) palette = data.palette
              if (MODES.indexOf(data.mode) !== -1) mode = data.mode
              if (DENSITIES.indexOf(data.density) !== -1) density = data.density
            }
          }
        } catch (e) {
          /* 非法快照或存储不可用:使用产品默认值,不阻断应用 */
        }
        var prefersDark = false
        try {
          prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches === true
        } catch (e) {
          prefersDark = false
        }
        var effective = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode
        root.setAttribute('data-ip-palette', palette)
        root.setAttribute('data-ip-theme-mode', mode)
        root.setAttribute('data-ip-color-mode', effective)
        root.setAttribute('data-ip-density', density)
        try {
          root.style.colorScheme = effective
        } catch (e) {
          /* colorScheme 不可用时不阻断 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
