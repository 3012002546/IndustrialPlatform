appId: com.industrialplatform.desktop
productName: Industrial Platform
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../../frontend/dist
    to: frontend-dist
    filter:
      - '**/*'
  - from: resources
    to: runtime
    filter:
      - '**/*'
win:
  target:
    - nsis
  artifactName: IndustrialPlatform-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
