name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore src/backend/IndustrialPlatform.slnx
      - run: dotnet build src/backend/IndustrialPlatform.slnx --configuration Release --no-restore
      - run: dotnet test src/backend/IndustrialPlatform.slnx --configuration Release --no-build --logger trx --logger "console;verbosity=detailed"
